<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA BLOQUEADO</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000; /* Começa no preto */
            color: #b19cd9; /* Lilás sólido, sem brilho */
            font-family: 'Arial Black', sans-serif;
            text-align: center;
            overflow: hidden;
            /* Animação de 0.2s para um efeito de alerta rápido */
            animation: alertaEscarlate 0.7s infinite;
        }

        @keyframes alertaEscarlate {
            0% { background-color: #000; }
            100% { background-color: #d60606; } /* Seu Vermelho Escarlate */
        }

        .aviso {
            z-index: 10;
            padding: 20px;
        }

        h1 {
            font-size: 3.5em;
            margin: 0;
            line-height: 1;
            /* Lilás puro, sem text-shadow para evitar luminosidade */
            color: #b19cd9; 
        }

        p {
            font-size: 1.8em;
            font-weight: bold;
            margin-top: 10px;
        }

        .icones {
            font-size: 4em;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="aviso">
        <p>A PLATAFORMA DE AGENTE DE COMBATE A ENDEMIAS COM 2 MIL QUESTÕES ENCONTRA-SE SOB CONTRATO DE EXCLUSIVIDADE ATÉ 30/09/26</p>
        <p>RETORNE DIA 01/10/26</p>
        <div class="icones">⚠️</div>

<div style="text-align: center; flex: 2; min-width: 120px;"> 
    <span style="color: orange; font-size: 0.75em; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Acessos ao Sistema</span><br>
    <span style="color: #39FF14; font-size: 1.4em; font-weight: 900; font-family: monospace; text-shadow: 0 0 10px rgba(57, 255, 20, 0.4); display: inline-block; margin-top: 5px;" id="contador-global-ace">...</span>
</div>
    </div>

    <script>
        // Trava a animação após 1 minuto (60.000ms)
        setTimeout(() => {
            document.body.style.animation = "none";
            document.body.style.backgroundColor = "#d60606"; // Fixa no seu escarlate
        }, 60000);
    </script>

</body>
<script>
// ===================================
// CONTADOR GLOBAL DE ACESSOS — ACE
// ===================================
async function registrarVisitanteGlobalACE() {

    // Procura o contador no DOM
    const elContador = document.getElementById('contador-global-ace');

    // Se a tela ACE ainda não foi criada no DOM,
    // tenta novamente depois de 500 ms.
    if (!elContador) {
        setTimeout(registrarVisitanteGlobalACE, 500);
        return;
    }

    const databaseURL =
        "https://projeto-aura-gcm-default-rtdb.firebaseio.com";

    const path =
        "/status_plataforma/acessosACE.json";

    const url =
        `${databaseURL}${path}`;

    try {

        // ======================
        // 1. BUSCA O VALOR ATUAL
        // =======================
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error(
                "Erro ao consultar Firebase: HTTP " + response.status
            );
        }

        const current = await response.json();

        // ===============
        // 2. INCREMENTA
        // ===============
        const novoValor =
            (typeof current === "number" ? current : 0) + 1;

        // =====================
        // 3. GRAVA NO FIREBASE
        // =====================
        const updateResponse = await fetch(url, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(novoValor)
        });

        if (!updateResponse.ok) {
            throw new Error(
                "Erro ao gravar Firebase: HTTP " +
                updateResponse.status
            );
        }
        // ========================
        // 4. MOSTRA NO CONTADOR
        // ========================
        elContador.innerText =
            novoValor.toLocaleString("pt-BR");

        console.log(
            "ACE — acesso registrado:",
            novoValor
        );

    } catch (error) {

        console.error(
            "ACE REST Error:",
            error
        );

        elContador.innerText = "OFFLINE";
    }
}
// =====================
// 5. INICIA O CONTADOR
// =====================
registrarVisitanteGlobalACE();
</script>
</html>
